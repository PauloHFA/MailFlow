[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mailflow"
version = "0.1.0"
description = "Automação segura de e-mails transacionais e lembretes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "dnspython>=2.7,<3",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "pydantic-settings>=2.7,<3",
    "reportlab>=4.2,<5",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not performance'"
markers = ["performance: local performance/load tests; run explicitly with -m performance"]
