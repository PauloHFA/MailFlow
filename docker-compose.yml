services:
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MailFlow <no-reply@mailflow.local>}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: celery -A src.worker:celery_app worker --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MailFlow <no-reply@mailflow.local>}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

  beat:
    build: .
    command: celery -A src.worker:celery_app beat --loglevel=INFO
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEST_RECIPIENT_ALLOWLIST: ${TEST_RECIPIENT_ALLOWLIST:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MailFlow <no-reply@mailflow.local>}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mailflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mailflow}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailflow}
      POSTGRES_USER: ${POSTGRES_USER:-mailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
